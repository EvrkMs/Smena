syntax = "proto3";

option csharp_namespace = "Grpc.Service.Salary";

package Salary;

import "google/protobuf/empty.proto";

service SalaryServiceGrpc {
	rpc AddSalaryOperation (SalaryOperatioAdd) returns (google.protobuf.Empty);
}

message SalaryOperatioAdd {
	int32 Amount = 1;
	string Comment = 2;
    SalaryOperatioTypeGrpc Type = 3;
    string EmployeeId = 4;
}

enum SalaryOperatioTypeGrpc{
    UNUF = 0;
    Regular = 1;
    Bonus = 2;
    Advance = 3;
    Inventory = 4;
    Fine = 5;
}